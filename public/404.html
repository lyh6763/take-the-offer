<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#e5191c" />
    <title>없는 주소 | TAKE THE OFFER</title>
    <!-- GitHub Pages가 /take-the-offer/ 아래의 없는 경로에 이 파일을 보낸다. 깊은 경로에서도 열리도록 링크는 프로젝트 기준 절대 경로로 쓴다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/take-the-offer/favicon-32.png" />
    <style>
      :root {
        --color-ink: #0b0b0b;
        --color-paper: #ffffff;
        --color-red: #e5191c;
        --color-red-bright: #ff4d4f;
        --space: clamp(1rem, 4vw, 2rem);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space);
        background: var(--color-ink);
        color: var(--color-paper);
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        line-height: 1.6;
      }
      main { max-width: 32rem; text-align: center; }
      h1 {
        margin: 0 0 0.5rem;
        display: inline-block;
        padding: 0.2em 0.6em;
        background: var(--color-red);
        color: var(--color-paper);
        font-size: clamp(1.5rem, 6vw, 2.25rem);
        transform: skew(-6deg);
      }
      p { margin: 1rem 0 1.5rem; }
      a {
        display: inline-block;
        padding: 0.7em 1.4em;
        background: var(--color-paper);
        color: var(--color-ink);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: var(--color-red-bright); color: var(--color-paper); }
      a:focus-visible { outline: 3px solid var(--color-red-bright); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>없는 주소</h1>
      <p>이 주소에는 작전이 없다. 주소가 바뀌었거나 잘못 입력됐을 수 있다.</p>
      <a href="/take-the-offer/#/hideout">아지트로 돌아가기</a>
    </main>
  </body>
</html>
